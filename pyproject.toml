[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinura"
version = "0.1.0"
description = "Contactless vital-sign monitoring with remote photoplethysmography"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.1,<2",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "opencv-contrib-python>=4.10,<6",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["engine/clinura"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine"]
extend-exclude = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
